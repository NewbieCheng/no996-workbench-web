server {
    listen 127.0.0.1:8897;
    server_name agent.no996ai.cn;
    root /srv/no996-workbench-web/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location = /api/v1/ai/audio/speech {
        proxy_pass https://worker.no996ai.cn;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host worker.no996ai.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
    location = /api/v1/ai/chat/completions {
        proxy_pass https://worker.no996ai.cn;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host worker.no996ai.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
    location /api/ {
        proxy_pass https://worker.no996ai.cn;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host worker.no996ai.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location /v1/ {
        proxy_pass https://worker.no996ai.cn;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host worker.no996ai.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    location /media/ {
        proxy_pass https://worker.no996ai.cn;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host worker.no996ai.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2?|css|js|json)$ {
        try_files $uri =404;
        expires 1h;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 80;
    listen [::]:80;
    server_name agent.no996ai.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/no996-workbench-web/acme;
        try_files $uri =404;
    }
    location / { return 301 https://agent.no996ai.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent.no996ai.cn;
    ssl_certificate /etc/letsencrypt/live/agent.no996ai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.no996ai.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /api/v1/ai/audio/speech {
        proxy_pass https://worker.no996ai.cn;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host worker.no996ai.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
    location = /api/v1/ai/chat/completions {
        proxy_pass https://worker.no996ai.cn;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host worker.no996ai.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
    location /api/ {
        proxy_pass https://worker.no996ai.cn;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host worker.no996ai.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location /v1/ {
        proxy_pass https://worker.no996ai.cn;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host worker.no996ai.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    location /media/ {
        proxy_pass https://worker.no996ai.cn;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host worker.no996ai.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:8897;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
